<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Principal -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Gradiente da Varinha Mágica / IA -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Gradiente do Feixe de Limpeza -->
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Sombra Glow Suave -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Arredondado Estilo Ícone de App -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#bgGradient)" filter="url(#glow)" />
  <rect x="9.5" y="9.5" width="101" height="101" rx="26.5" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-opacity="0.45" />

  <!-- Moldura de Vídeo / Tela Stylized -->
  <rect x="22" y="24" width="76" height="52" rx="14" fill="#0b132b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Mini Perfurações de Filme de Cinema no Topo e Base da Moldura -->
  <rect x="28" y="28" width="6" height="4" rx="1.5" fill="#38bdf8" fill-opacity="0.6" />
  <rect x="42" y="28" width="6" height="4" rx="1.5" fill="#38bdf8" fill-opacity="0.6" />
  <rect x="56" y="28" width="6" height="4" rx="1.5" fill="#38bdf8" fill-opacity="0.6" />
  <rect x="70" y="28" width="6" height="4" rx="1.5" fill="#38bdf8" fill-opacity="0.6" />
  <rect x="84" y="28" width="6" height="4" rx="1.5" fill="#38bdf8" fill-opacity="0.6" />

  <!-- Marca d'Água Sendo Apagada / Ondas Desvanecendo -->
  <path d="M 32 50 Q 42 42, 52 50 T 72 50" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="3,3" opacity="0.4" />
  
  <!-- Feixe de Luz / Varinha de Inpainting Inteligente -->
  <path d="M 40 88 L 78 44" stroke="url(#sparkleGrad)" stroke-width="5" stroke-linecap="round" />
  <path d="M 72 50 L 78 44 L 70 46 Z" fill="#ffffff" />

  <!-- Estrela de IA Principal (4 pontas brilhantes) -->
  <path d="M 82 40 Q 82 48, 90 48 Q 82 48, 82 56 Q 82 48, 74 48 Q 82 48, 82 40 Z" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Mini Brilhos de IA Adicionais -->
  <path d="M 94 30 Q 94 34, 98 34 Q 94 34, 94 38 Q 94 34, 90 34 Q 94 34, 94 30 Z" fill="#38bdf8" />
  <circle cx="68" cy="36" r="2" fill="#e0f2fe" />
  <circle cx="34" cy="62" r="1.5" fill="#7dd3fc" />

  <!-- Check de Conclusão / Limpeza Perfeita -->
  <circle cx="50" cy="50" r="10" fill="#0284c7" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" />
  <path d="M 46 50 L 49 53 L 55 47" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
